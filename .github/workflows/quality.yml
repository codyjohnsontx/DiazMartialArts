name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.member_app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The site behaves differently depending on whether the separate Diaz on
      # Demand app is configured, and each state skips the other's tests. Run
      # both so neither branch can rot: "configured" uses a stand-in host for the
      # deployed member app, "unconfigured" uses the same reserved .invalid
      # placeholder .env.example ships, which is what production runs today.
      matrix:
        include:
          - member_app: configured
            ondemand_url: https://ondemand.example.com
          - member_app: unconfigured
            ondemand_url: https://replace-me.invalid
    env:
      NEXT_PUBLIC_SITE_URL: https://diazmartialarts.vercel.app
      NEXT_PUBLIC_ONDEMAND_URL: ${{ matrix.ondemand_url }}
      ONDEMAND_COMING_SOON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser revisions are pinned by the Playwright version, so resolve the
      # version that npm actually installed rather than trusting a hand-written
      # string or a lockfile hash. An empty result would silently collapse the
      # cache key onto a constant, so fail loudly instead.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not resolve the installed Playwright version" >&2
            exit 1
          fi
          echo "Resolved Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # There is deliberately no `install-deps` step. It opens with an
      # unconditional `apt-get update`, so every run staked both matrix legs on
      # the Ubuntu mirrors, and that is exactly how they died on 2026-08-19: the
      # Azure mirror stopped answering, apt spent the step's whole budget
      # retrying it, and the gate never ran.
      #
      # It was not buying the libraries it looks like it buys. In the last run
      # that got through it (32185249296), all 21 packages Playwright lists for
      # Chromium - libnss3, libgbm1, libasound2t64, the rest - plus xvfb were
      # already the newest version, because the hosted image preinstalls Chrome,
      # Chromium, Edge and Firefox, which depend on them. The only thing it
      # installed was 21 MB of fonts from Playwright's `tools` group: CJK, Thai,
      # Cyrillic and Unifont fallbacks. Nothing here asserts on a glyph: the
      # suite compares no screenshots, only DOM text and accessible names, and
      # the images it does capture are failure artefacts. So dropping the fonts
      # cannot change a test result, and it cannot change what a visitor sees
      # either, since production type resolves on the visitor's own device.
      #
      # Trade-off worth knowing before re-adding it: without those fallbacks a
      # bare font set renders the UI's ▸ ★ ☰ ✕ as tofu, so a future visual test
      # should pin the fonts it needs itself rather than restore a step whose
      # cost is a mirror round trip on every run. A library genuinely going
      # missing still fails loudly - Playwright checks at launch and names both
      # the missing libraries and the command to install them.

      # Chromium only: every project in playwright.config.ts is Chromium-backed,
      # so an unqualified install would also download Firefox and WebKit that
      # nothing launches. This resolves to chromium, its headless shell and
      # ffmpeg. Adding a project on another engine will fail loudly at launch.
      #
      # Runs on a cache hit too: it then only verifies the browsers are present
      # and re-downloads anything the cache was missing. Skipping it on a hit
      # would let the suite run against a half-restored browser directory.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Run quality gate
        run: npm run quality
