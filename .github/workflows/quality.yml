name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://diazmartialarts.vercel.app
      # A stand-in for the deployed Diaz on Demand app so CI exercises the
      # configured member-link path. Requests to it are stubbed in the e2e tests.
      NEXT_PUBLIC_ONDEMAND_URL: https://ondemand.example.com
      ONDEMAND_COMING_SOON: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality gate
        run: npm run quality
