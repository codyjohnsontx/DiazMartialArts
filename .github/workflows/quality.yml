name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.member_app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The site behaves differently depending on whether the separate Diaz on
      # Demand app is configured, and each state skips the other's tests. Run
      # both so neither branch can rot: "configured" uses a stand-in host for the
      # deployed member app, "unconfigured" uses the same reserved .invalid
      # placeholder .env.example ships, which is what production runs today.
      matrix:
        include:
          - member_app: configured
            ondemand_url: https://ondemand.example.com
          - member_app: unconfigured
            ondemand_url: https://replace-me.invalid
    env:
      NEXT_PUBLIC_SITE_URL: https://diazmartialarts.vercel.app
      NEXT_PUBLIC_ONDEMAND_URL: ${{ matrix.ondemand_url }}
      ONDEMAND_COMING_SOON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality gate
        run: npm run quality
