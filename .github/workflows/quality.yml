name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.member_app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The site behaves differently depending on whether the separate Diaz on
      # Demand app is configured, and each state skips the other's tests. Run
      # both so neither branch can rot: "configured" uses a stand-in host for the
      # deployed member app, "unconfigured" uses the same reserved .invalid
      # placeholder .env.example ships, which is what production runs today.
      matrix:
        include:
          - member_app: configured
            ondemand_url: https://ondemand.example.com
          - member_app: unconfigured
            ondemand_url: https://replace-me.invalid
    env:
      NEXT_PUBLIC_SITE_URL: https://diazmartialarts.vercel.app
      NEXT_PUBLIC_ONDEMAND_URL: ${{ matrix.ondemand_url }}
      ONDEMAND_COMING_SOON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser revisions are pinned by the Playwright version, so resolve the
      # version that npm actually installed rather than trusting a hand-written
      # string or a lockfile hash. An empty result would silently collapse the
      # cache key onto a constant, so fail loudly instead.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not resolve the installed Playwright version" >&2
            exit 1
          fi
          echo "Resolved Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # There is deliberately no `playwright install-deps` step, because on this
      # runner it installs no library Chromium actually needs. Playwright splits
      # its Ubuntu package map into a `chromium` group (21 shared libraries) and
      # a `tools` group (xvfb and fonts); apt reported all 21 of the former
      # "already the newest version" on the ubuntu-latest image, so the
      # command's entire effect was 21.1 MB of font packages from the latter -
      # CJK, Thai and X11 bitmap fonts for scripts this English-only site never
      # renders. No test rasterises a glyph: the suite asserts on the DOM and
      # has no screenshot comparisons, and the Latin text and lone U+1F4DE emoji
      # in the content are covered by fonts-liberation, DejaVu and
      # fonts-noto-color-emoji, all preinstalled regardless of this step.
      #
      # What it did buy was a coin flip in the critical path. In run
      # 32206562036 the two matrix legs drew different Ubuntu mirrors: the same
      # apt work took 19s on one leg and, at 112 kB/s, blew a five-minute bound
      # on the other, failing the job before a single test ran.
      #
      # Should a future runner image drop one of those 21 libraries, Chromium
      # fails at launch and Playwright's error names both the library and the
      # `install-deps` command that restores it - a loud, deterministic failure
      # rather than a slow one decided by which mirror the runner drew.

      # Chromium only: every project in playwright.config.ts is Chromium-backed,
      # so an unqualified install would also download Firefox and WebKit that
      # nothing launches. This resolves to chromium, its headless shell and
      # ffmpeg. Adding a project on another engine will fail loudly at launch.
      #
      # Runs on a cache hit too: it then only verifies the browsers are present
      # and re-downloads anything the cache was missing. Skipping it on a hit
      # would let the suite run against a half-restored browser directory.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Run quality gate
        run: npm run quality
